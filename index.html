<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0B0D10"/>
<title>Apex Pathway — Automotive Build Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ── DESIGN TOKENS ──────────────────────────────────────── */
:root {
  --bg:       #0B0D10;
  --surface:  #0F1318;
  --card:     #12161C;
  --card2:    #161B23;
  --border:   rgba(255,255,255,.06);
  --border2:  rgba(255,255,255,.10);
  --primary:  #3B82F6;
  --primary-d:#2563EB;
  --primary-g:rgba(59,130,246,.12);
  --cyan:     #22D3EE;
  --green:    #10B981;
  --amber:    #F59E0B;
  --red:      #EF4444;
  --text:     #E6EAF0;
  --sub:      #6B7280;
  --muted:    #374151;
  --font:     'Space Grotesk', system-ui, sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --r:        10px;
  --r-sm:     6px;
  --sidebar:  240px;
  --topbar:   56px;
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { overflow-x: hidden; scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: #1E2430; border-radius: 2px; }
::selection { background: rgba(59,130,246,.3); }

/* ── LAYOUT ─────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh; }

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0;
  height: 100vh; z-index: 200;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.sidebar.closed { transform: translateX(-100%); }

.sb-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-logo-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sb-logo-img { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: #000; }
.sb-logo-text { display: flex; flex-direction: column; }
.sb-brand { font-size: 13px; font-weight: 700; letter-spacing: .5px; color: var(--text); }
.sb-tagline { font-size: 10px; color: var(--sub); letter-spacing: .5px; margin-top: 1px; }

.sb-build-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 12px;
}
.sb-build-label { font-size: 9px; color: var(--sub); letter-spacing: 3px; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
.sb-build-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-build-model { font-size: 11px; color: var(--primary); margin-top: 2px; }
.sb-build-pbar { margin-top: 8px; }
.sb-pbar-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.sb-pbar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: 2px; transition: width .6s ease; }
.sb-pbar-meta { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10px; color: var(--sub); font-family: var(--mono); }

.sb-nav { padding: 8px 0; flex: 1; overflow-y: auto; }
.sb-section-label { font-size: 9px; font-weight: 600; letter-spacing: 3px; color: var(--muted); padding: 12px 18px 4px; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 18px;
  border: none; background: transparent; cursor: pointer;
  font-family: var(--font); font-size: 13px; font-weight: 500;
  color: var(--sub); text-align: left;
  border-left: 2px solid transparent;
  transition: all .15s ease;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.02); color: var(--text); }
.nav-item.active { background: var(--primary-g); color: var(--text); border-left-color: var(--primary); }
.nav-icon { font-size: 14px; width: 18px; flex-shrink: 0; opacity: .8; }
.nav-badge { margin-left: auto; background: var(--primary); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 10px; }

.sb-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-user { display: flex; align-items: center; gap: 10px; }
.sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-g); border: 1px solid rgba(59,130,246,.3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--primary); flex-shrink: 0; }
.sb-user-info { flex: 1; min-width: 0; }
.sb-username { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-role { font-size: 10px; color: var(--sub); }
.sb-logout { background: transparent; border: none; cursor: pointer; color: var(--sub); font-size: 14px; padding: 4px; border-radius: 4px; transition: color .15s; }
.sb-logout:hover { color: var(--red); }

/* ── TOPBAR ──────────────────────────────────────────────── */
.topbar {
  position: fixed; top: 0; left: var(--sidebar); right: 0;
  height: var(--topbar);
  background: rgba(11,13,16,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 24px; z-index: 100;
  transition: left .3s cubic-bezier(.4,0,.2,1);
}
.topbar.full { left: 0; }
.ham-btn { display: none; background: transparent; border: none; cursor: pointer; color: var(--sub); font-size: 18px; padding: 4px; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.topbar-sub { font-size: 12px; color: var(--sub); margin-left: 4px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25);
  font-size: 11px; color: var(--green); font-weight: 500;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* ── MAIN CONTENT ────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar);
  padding-top: var(--topbar);
  flex: 1; min-width: 0;
  transition: margin-left .3s cubic-bezier(.4,0,.2,1);
}
.main.full { margin-left: 0; }
.page { padding: 28px 28px 60px; max-width: 1200px; }

/* ── OVERLAY ─────────────────────────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 150;
}
.overlay.visible { display: block; }

/* ── MOBILE NAV ──────────────────────────────────────────── */
.mob-nav { display: none; }

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .topbar { left: 0 !important; }
  .main { margin-left: 0 !important; }
  .ham-btn { display: flex; align-items: center; justify-content: center; }
  .page { padding: 16px 14px 80px; }
  .mob-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    z-index: 100; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around; overflow-x: auto;
  }
  .mob-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: none; cursor: pointer; font-family: var(--font); font-size: 9px; color: var(--sub); padding: 3px 8px; min-width: 44px; }
  .mob-btn.active { color: var(--primary); }
  .mob-icon { font-size: 17px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-3 { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-2 { grid-template-columns: 1fr !important; }
}
@media (max-width: 480px) {
  .grid-4 { grid-template-columns: 1fr 1fr !important; }
  .grid-3 { grid-template-columns: 1fr 1fr !important; }
}

/* ── TYPOGRAPHY ──────────────────────────────────────────── */
.page-header { margin-bottom: 24px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.page-desc { font-size: 13px; color: var(--sub); margin-top: 4px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: var(--sub); text-transform: uppercase; margin-bottom: 12px; }

/* ── CARDS ───────────────────────────────────────────────── */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); }
.card-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }

/* ── GRIDS ───────────────────────────────────────────────── */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.gap-16 { gap: 16px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }
.mb-24 { margin-bottom: 24px; }

/* ── STAT CARDS ──────────────────────────────────────────── */
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0; transition: opacity .3s; }
.stat-card:hover::before { opacity: 1; }
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; }
.stat-value { font-size: 26px; font-family: var(--mono); font-weight: 600; color: var(--text); line-height: 1; }
.stat-sub { font-size: 11px; color: var(--sub); margin-top: 6px; }
.stat-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; }
.stat-trend.up { color: var(--green); }
.stat-trend.down { color: var(--red); }
@media(max-width:768px) { .stat-value { font-size: 20px; } }

/* ── BADGES / TAGS ───────────────────────────────────────── */
.badge { font-size: 10px; font-weight: 600; letter-spacing: .5px; padding: 3px 8px; border-radius: 4px; display: inline-block; white-space: nowrap; user-select: none; }
.badge-planned  { background: rgba(107,114,128,.12); color: #9CA3AF; border: 1px solid rgba(107,114,128,.2); }
.badge-ordered  { background: rgba(59,130,246,.12);  color: #60A5FA; border: 1px solid rgba(59,130,246,.25); }
.badge-installed{ background: rgba(245,158,11,.12);  color: #FCD34D; border: 1px solid rgba(245,158,11,.25); }
.badge-completed{ background: rgba(16,185,129,.12);  color: #34D399; border: 1px solid rgba(16,185,129,.25); }
.badge-critical { background: rgba(239,68,68,.12);   color: #F87171; border: 1px solid rgba(239,68,68,.25); }
.badge-high     { background: rgba(245,158,11,.12);  color: #FCD34D; border: 1px solid rgba(245,158,11,.25); }
.badge-medium   { background: rgba(59,130,246,.12);  color: #60A5FA; border: 1px solid rgba(59,130,246,.25); }
.badge-low      { background: rgba(107,114,128,.12); color: #9CA3AF; border: 1px solid rgba(107,114,128,.2); }
.badge-up_to_date{ background: rgba(16,185,129,.12); color: #34D399; border: 1px solid rgba(16,185,129,.25); }
.badge-due      { background: rgba(245,158,11,.12);  color: #FCD34D; border: 1px solid rgba(245,158,11,.25); }
.badge-overdue  { background: rgba(239,68,68,.12);   color: #F87171; border: 1px solid rgba(239,68,68,.25); }

/* ── PROGRESS BAR ────────────────────────────────────────── */
.pbar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.pbar-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }
.pbar-blue  { background: linear-gradient(90deg, var(--primary), var(--cyan)); }
.pbar-green { background: var(--green); }
.pbar-amber { background: var(--amber); }
.pbar-red   { background: var(--red); }

/* ── FORMS ───────────────────────────────────────────────── */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--sub); text-transform: uppercase; }
input, textarea, select {
  font-family: var(--font); font-size: 14px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border2);
  border-radius: var(--r-sm); color: var(--text); outline: none;
  transition: border-color .15s;
}
input, select { padding: 9px 12px; width: 100%; }
textarea { padding: 9px 12px; width: 100%; resize: vertical; min-height: 70px; line-height: 1.6; }
select { background: var(--card); cursor: pointer; }
input:focus, textarea:focus, select:focus { border-color: rgba(59,130,246,.5); background: rgba(59,130,246,.04); }
input::placeholder { color: var(--muted); }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media(max-width:600px) { .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; } }

/* ── BUTTONS ─────────────────────────────────────────────── */
button { font-family: var(--font); cursor: pointer; transition: all .15s ease; border: none; background: transparent; color: inherit; }
.btn-primary { padding: 9px 18px; background: var(--primary); color: #fff; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; }
.btn-primary:hover { background: var(--primary-d); }
.btn-secondary { padding: 9px 16px; background: rgba(255,255,255,.05); border: 1px solid var(--border2); color: var(--text); border-radius: var(--r-sm); font-size: 13px; font-weight: 500; }
.btn-secondary:hover { background: rgba(255,255,255,.08); border-color: var(--border2); }
.btn-ghost { padding: 7px 14px; background: transparent; border: 1px solid var(--border); color: var(--sub); border-radius: var(--r-sm); font-size: 12px; font-weight: 500; }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-danger { padding: 7px 13px; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); color: #F87171; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; }
.btn-danger:hover { background: rgba(239,68,68,.2); }
.btn-icon { padding: 6px 10px; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--sub); border-radius: var(--r-sm); font-size: 13px; }
.btn-icon:hover { background: rgba(255,255,255,.08); color: var(--text); }
.btn-filter { padding: 6px 14px; background: transparent; border: 1px solid var(--border); color: var(--sub); border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 1px; transition: all .15s; }
.btn-filter.active { background: var(--primary-g); border-color: rgba(59,130,246,.4); color: var(--text); }

/* ── TABLE ───────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--sub); text-transform: uppercase; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,.015); }

/* ── MOBILE TABLE CARDS ───────────────────────────────────── */
.mobile-card { display: none; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
@media(max-width:768px) {
  .desktop-only { display: none !important; }
  .mobile-card { display: block; }
}

/* ── PARTS EXPAND PANEL ───────────────────────────────────── */
.expand-panel { background: rgba(59,130,246,.03); border-bottom: 1px solid var(--border); padding: 16px 18px; }

/* ── ADD FORM ────────────────────────────────────────────── */
.add-form-wrap {
  background: rgba(59,130,246,.05);
  border: 1px dashed rgba(59,130,246,.3);
  border-radius: var(--r); padding: 18px; margin-bottom: 16px;
}
.add-form-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; margin-bottom: 14px; }

/* ── TIMELINE ────────────────────────────────────────────── */
.timeline { position: relative; padding-left: 32px; }
.timeline::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.tl-event { position: relative; margin-bottom: 20px; }
.tl-dot { position: absolute; left: -32px; top: 4px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid; flex-shrink: 0; }
.tl-dot-planned   { background: rgba(107,114,128,.15); border-color: rgba(107,114,128,.4); color: #9CA3AF; }
.tl-dot-ordered   { background: rgba(59,130,246,.15);  border-color: rgba(59,130,246,.5);  color: #60A5FA; }
.tl-dot-installed { background: rgba(245,158,11,.15);  border-color: rgba(245,158,11,.5);  color: #FCD34D; }
.tl-dot-completed { background: rgba(16,185,129,.15);  border-color: rgba(16,185,129,.5);  color: #34D399; }
.tl-content { background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; }
.tl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tl-title { font-size: 13px; font-weight: 600; color: var(--text); }
.tl-time { font-size: 11px; color: var(--sub); margin-left: auto; font-family: var(--mono); }
.tl-msg { font-size: 12px; color: var(--sub); line-height: 1.5; }

/* ── BUDGET RING ─────────────────────────────────────────── */
.budget-ring-wrap { display: flex; align-items: center; justify-content: center; padding: 20px 0; }
.budget-ring { position: relative; width: 140px; height: 140px; }
.ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 10; }
.ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray .8s ease; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-pct { font-size: 24px; font-family: var(--mono); font-weight: 600; }
.ring-pct-label { font-size: 10px; color: var(--sub); margin-top: 2px; }

/* ── MAINTENANCE ─────────────────────────────────────────── */
.mnt-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); transition: background .1s; }
.mnt-item:hover { background: rgba(255,255,255,.01); }
.mnt-item:last-child { border-bottom: none; }
.mnt-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; }
.mnt-check.up_to_date { background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.5); color: var(--green); }
.mnt-check.due        { background: rgba(245,158,11,.15);  border-color: rgba(245,158,11,.5);  color: var(--amber); }
.mnt-check.overdue    { background: rgba(239,68,68,.15);   border-color: rgba(239,68,68,.5);   color: var(--red); }

/* ── ESTIMATOR ───────────────────────────────────────────── */
.est-result { background: var(--card2); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-top: 16px; }
.est-hp-range { font-size: 40px; font-family: var(--mono); font-weight: 700; color: var(--cyan); }
.est-warning { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.25); border-radius: var(--r-sm); padding: 10px 14px; margin-top: 12px; font-size: 12px; color: #FCD34D; line-height: 1.5; }

/* ── LOADER ──────────────────────────────────────────────── */
.loader { display: flex; align-items: center; justify-content: center; height: 120px; gap: 6px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EMPTY STATE ─────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; color: var(--sub); gap: 10px; }
.empty-icon { font-size: 36px; opacity: .4; }
.empty-text { font-size: 14px; }
.empty-sub  { font-size: 12px; opacity: .6; }

/* ── LOGIN ───────────────────────────────────────────────── */
#login-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.login-card {
  width: 100%; max-width: 400px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 40px 36px;
  margin: 16px;
}
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center; }
.login-logo-img { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; background: #000; }

/* ── TOAST ───────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9000;

}
.toast-msg {
  padding: 10px 16px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  animation: slideIn .25s ease;
  pointer-events: all;
}
.toast-success { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3); color: #34D399; }

.toast-info    { background: rgba(59,130,246,.15);  border: 1px solid rgba(59,130,246,.3);  color: #60A5FA; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── MODAL ───────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 500; display: flex; align-items: center; justify-content: center;
  padding: 16px; display: none;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 24px;
  width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-close { background: transparent; border: none; cursor: pointer; color: var(--sub); font-size: 20px; padding: 2px; }
.modal-close:hover { color: var(--text); }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ── INFO ROW ────────────────────────────────────────────── */
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-row .label { color: var(--sub); }
.info-row .value { font-weight: 500; color: var(--text); font-family: var(--mono); }

/* ── UTILITY ─────────────────────────────────────────────── */
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8  { gap: 8px; }
.gap-10 { gap: 10px; }
.gap-12 { gap: 12px; }

.mono { font-family: var(--mono); }

.text-green   { color: var(--green); }
.text-amber   { color: var(--amber); }
.text-red     { color: var(--red); }

.text-sm      { font-size: 12px; }
.text-xs      { font-size: 11px; }
.font-bold    { font-weight: 700; }
.font-600     { font-weight: 600; }
.w-full       { width: 100%; }
.divider      { height: 1px; background: var(--border); margin: 16px 0; }
</style>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG — replace with your real Supabase URL & anon key
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON = 'YOUR_ANON_KEY';

// ───────────────────────────────────────────────────────────
// DEMO MODE — set to true if no Supabase configured
// ───────────────────────────────────────────────────────────
const DEMO_MODE = (SUPABASE_URL === 'https://YOUR_PROJECT.supabase.co');

// ═══════════════════════════════════════════════════════════
// SUPABASE CLIENT
// ═══════════════════════════════════════════════════════════
let sb = null;
if (!DEMO_MODE) {
  const { createClient } = supabase;
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
}

// ═══════════════════════════════════════════════════════════
// DEMO DATA
// ═══════════════════════════════════════════════════════════
const DEMO_USER = { id: 'demo-user', email: 'demo@apexpathway.com' };

const DEMO_BUILDS = [
  {
    id: 'b1', user_id: 'demo-user',
    name: 'E39 Supercharger Build',
    car_model: '2002 BMW 535i E39',
    budget_total: 3000,
    status: 'active'
  }
];

const DEMO_PARTS = [
  { id:'p1', build_id:'b1', name:'Jaguar Eaton M112 Supercharger', price:245, category:'Forced Induction', status:'planned' },
  { id:'p2', build_id:'b1', name:'PartsSpy M112 Adapter Kit',      price:500, category:'Forced Induction', status:'planned' },
  { id:'p3', build_id:'b1', name:'M62TUB44 Engine',                price:1100,category:'Engine',           status:'ordered' },
  { id:'p4', build_id:'b1', name:'Timing Chain Guides',            price:60,  category:'Engine Rebuild',   status:'ordered' },
  { id:'p5', build_id:'b1', name:'Timing Chain Tensioners ×2',     price:50,  category:'Engine Rebuild',   status:'installed'},
  { id:'p6', build_id:'b1', name:'VANOS Seal Kit (Beisan)',         price:80,  category:'Engine Rebuild',   status:'installed'},
  { id:'p7', build_id:'b1', name:'Valve Cover Gaskets ×2',         price:45,  category:'Engine Rebuild',   status:'planned' },
  { id:'p8', build_id:'b1', name:'Expansion Tank + Cap',           price:30,  category:'Cooling',          status:'completed'},
  { id:'p9', build_id:'b1', name:'Thermostat 80°C',                price:15,  category:'Cooling',          status:'planned' },
  { id:'p10',build_id:'b1', name:'Fuel Pump 255lph',               price:55,  category:'Fuel System',      status:'planned' },
  { id:'p11',build_id:'b1', name:'Injectors Set ×8 ~440cc',        price:150, category:'Fuel System',      status:'planned' },
  { id:'p12',build_id:'b1', name:'ECU Tune (Local)',                price:200, category:'Tuning',           status:'planned' },
  { id:'p13',build_id:'b1', name:'NGK Spark Plugs ×8',             price:35,  category:'Ignition',         status:'planned' },
  { id:'p14',build_id:'b1', name:'Oil Catch Can',                  price:40,  category:'Engine',           status:'planned' },
];

const DEMO_MAINTENANCE = [
  { id:'m1', build_id:'b1', item:'Oil Change',     cost:45,  interval_km:7000,  interval_months:6, last_done:'2024-10-15', next_due:'2025-04-15', status:'overdue'    },
  { id:'m2', build_id:'b1', item:'Brake Fluid',    cost:30,  interval_km:null,  interval_months:24,last_done:'2024-06-01', next_due:'2026-06-01', status:'up_to_date' },
  { id:'m3', build_id:'b1', item:'Coolant Flush',  cost:65,  interval_km:null,  interval_months:24,last_done:'2024-11-01', next_due:'2026-11-01', status:'up_to_date' },
  { id:'m4', build_id:'b1', item:'Spark Plugs',    cost:95,  interval_km:30000, interval_months:null,last_done:'2023-05-20',next_due:'2025-05-20',status:'due'       },
  { id:'m5', build_id:'b1', item:'Air Filter',     cost:25,  interval_km:15000, interval_months:12,last_done:'2024-09-10', next_due:'2025-09-10', status:'up_to_date' },
];

// ═══════════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════════
const state = {
  user: null,
  currentBuild: null,
  builds: [],
  parts: [],
  maintenance: [],
  timelineEvents: [],
  currentPage: 'dashboard',
};

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const fmt = n => '$' + (+n || 0).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
const mkId = () => 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast-msg toast-${type}`;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function setLoading(html) {
  $('page-content').innerHTML = html || '<div class="loader"><div class="spinner"></div><span class="text-sub text-sm">Loading…</span></div>';
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
async function initAuth() {
  if (DEMO_MODE) {
    // Check demo session
    const demo = sessionStorage.getItem('ap-demo-session');
    if (demo) {
      state.user = DEMO_USER;
      bootApp();
    } else {
      showLogin();
    }
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user = session.user;
    bootApp();
  } else {
    showLogin();
  }
}

function showLogin() {
  $('login-screen').style.display = 'flex';
  $('app-shell').style.display   = 'none';
}

async function handleLogin() {
  const email = $('login-email').value.trim();
  const pass  = $('login-password').value;
  const errEl = $('login-error');
  const btn   = $('login-btn');

  errEl.classList.remove('visible');
  if (!email || !pass) { errEl.textContent='Please enter your email and password.'; errEl.classList.add('visible'); return; }

  btn.textContent = 'Signing in…'; btn.disabled = true;

  if (DEMO_MODE) {
    // Demo login check
    if (email === 'demo@apexpathway.com' && pass === 'demo1234') {
      sessionStorage.setItem('ap-demo-session', '1');
      state.user = DEMO_USER;
      bootApp();
    } else {
      errEl.textContent = 'Invalid credentials. Use demo@apexpathway.com / demo1234';
      errEl.classList.add('visible');
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
    return;
  }

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    state.user = data.user;
    bootApp();
  } catch(e) {
    errEl.textContent = e.message || 'Login failed. Check your credentials.';
    errEl.classList.add('visible');
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

async function handleLogout() {
  if (DEMO_MODE) { sessionStorage.removeItem('ap-demo-session'); }
  else { await sb.auth.signOut(); }
  state.user = null; state.currentBuild = null;
  state.builds = []; state.parts = []; state.maintenance = [];
  showLogin();
  $('login-btn').textContent = 'Sign In'; $('login-btn').disabled = false;
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
async function bootApp() {
  $('login-screen').style.display = 'none';
  $('app-shell').style.display    = 'flex';

  // Set user info
  const email = state.user.email || 'User';
  const initials = email.slice(0,2).toUpperCase();
  $('sb-avatar').textContent  = initials;
  $('sb-username').textContent = email.split('@')[0];

  await loadBuilds();
  navigate('dashboard');
}

// ═══════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════
async function loadBuilds() {
  if (DEMO_MODE) {
    state.builds = DEMO_BUILDS;
    state.currentBuild = DEMO_BUILDS[0];
    await loadBuildData();
    return;
  }
  const { data, error } = await sb.from('builds').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false });
  if (error) { toast('Failed to load builds', 'error'); return; }
  state.builds = data || [];
  state.currentBuild = state.builds[0] || null;
  if (state.currentBuild) await loadBuildData();
}

async function loadBuildData() {
  if (!state.currentBuild) return;
  if (DEMO_MODE) {
    state.parts = DEMO_PARTS.filter(p => p.build_id === state.currentBuild.id);
    state.maintenance = DEMO_MAINTENANCE.filter(m => m.build_id === state.currentBuild.id);
    state.timelineEvents = generateTimeline(state.parts);
    updateSidebar();
    return;
  }
  const bid = state.currentBuild.id;
  const [pr, mn] = await Promise.all([
    sb.from('parts').select('*').eq('build_id', bid).order('created_at'),
    sb.from('maintenance').select('*').eq('build_id', bid).order('created_at'),
  ]);
  state.parts = pr.data || [];
  state.maintenance = mn.data || [];
  state.timelineEvents = generateTimeline(state.parts);
  updateSidebar();
}

async function savePart(part) {
  if (DEMO_MODE) {
    if (part.id) {
      state.parts = state.parts.map(p => p.id === part.id ? part : p);
    } else {
      const np = { ...part, id: mkId(), build_id: state.currentBuild.id };
      state.parts.push(np);
    }
    state.timelineEvents = generateTimeline(state.parts);
    updateSidebar();
    return true;
  }
  if (part.id) {
    const { error } = await sb.from('parts').update(part).eq('id', part.id);
    if (error) { toast('Failed to save part', 'error'); return false; }
  } else {
    const { data, error } = await sb.from('parts').insert({ ...part, build_id: state.currentBuild.id }).select().single();
    if (error) { toast('Failed to add part', 'error'); return false; }
    state.parts.push(data);
  }
  // Auto-insert timeline event
  await insertTimelineEvent(part.status, part.name);
  state.timelineEvents = generateTimeline(state.parts);
  updateSidebar();
  return true;
}

async function deletePart(id) {
  if (DEMO_MODE) {
    state.parts = state.parts.filter(p => p.id !== id);
    state.timelineEvents = generateTimeline(state.parts);
    updateSidebar();
    return;
  }
  await sb.from('parts').delete().eq('id', id);
  state.parts = state.parts.filter(p => p.id !== id);
  state.timelineEvents = generateTimeline(state.parts);
  updateSidebar();
}

async function saveMaintenance(item) {
  if (DEMO_MODE) {
    if (item.id) {
      state.maintenance = state.maintenance.map(m => m.id === item.id ? item : m);
    } else {
      state.maintenance.push({ ...item, id: mkId(), build_id: state.currentBuild.id });
    }
    return true;
  }
  if (item.id) {
    const { error } = await sb.from('maintenance').update(item).eq('id', item.id);
    if (error) { toast('Failed to save', 'error'); return false; }
  } else {
    const { data, error } = await sb.from('maintenance').insert({ ...item, build_id: state.currentBuild.id }).select().single();
    if (error) { toast('Failed to add item', 'error'); return false; }
    state.maintenance.push(data);
  }
  return true;
}

async function deleteMaintenance(id) {
  if (DEMO_MODE) { state.maintenance = state.maintenance.filter(m => m.id !== id); return; }
  await sb.from('maintenance').delete().eq('id', id);
  state.maintenance = state.maintenance.filter(m => m.id !== id);
}

async function insertTimelineEvent(eventType, message) {
  if (DEMO_MODE) return;
  await sb.from('timeline_events').insert({
    build_id: state.currentBuild.id,
    event_type: eventType,
    message: message,
  });
}

// ═══════════════════════════════════════════════════════════
// TIMELINE GENERATION (auto, read-only)
// ═══════════════════════════════════════════════════════════
function generateTimeline(parts) {
  const events = [];
  const now = new Date();

  const statuses = ['planned','ordered','installed','completed'];
  const labels = {
    planned:   { icon: '○', label: 'Planning Phase',     color: 'planned'   },
    ordered:   { icon: '→', label: 'Parts Ordered',      color: 'ordered'   },
    installed: { icon: '↑', label: 'Installation Phase', color: 'installed' },
    completed: { icon: '✓', label: 'Build Completed',    color: 'completed' },
  };

  // Group parts by status
  const groups = {};
  for (const s of statuses) {
    const g = parts.filter(p => p.status === s);
    if (g.length > 0) {
      groups[s] = g;
    }
  }

  let idx = 0;
  for (const s of statuses) {
    if (!groups[s]) continue;
    const g = groups[s];
    const meta = labels[s];
    events.push({
      id: s,
      event_type: s,
      label: meta.label,
      icon: meta.icon,
      color: meta.color,
      message: `${g.length} part${g.length !== 1?'s':''}: ${g.slice(0,3).map(p=>p.name).join(', ')}${g.length>3?` +${g.length-3} more`:''}`,
      parts: g,
      created_at: new Date(now.getTime() - (statuses.length - idx) * 86400000 * 7).toISOString(),
    });
    idx++;
  }

  return events;
}

function updateSidebar() {
  if (!state.currentBuild) return;
  const b = state.currentBuild;
  $('sb-build-name').textContent  = b.name || 'Unnamed Build';
  $('sb-build-model').textContent = b.car_model || '—';

  const parts = state.parts;
  const total = parts.length;
  const done  = parts.filter(p => p.status === 'completed' || p.status === 'installed').length;
  const pct   = total > 0 ? Math.round(done / total * 100) : 0;

  $('sb-progress').style.width = pct + '%';
  $('sb-pct').textContent = pct + '%';
  $('sb-progress-label').textContent = `${done}/${total} parts`;
}

// ═══════════════════════════════════════════════════════════
// BUDGET CALCULATIONS
// ═══════════════════════════════════════════════════════════
function calcBudget() {
  const parts = state.parts;
  const total    = parts.reduce((s,p) => s + (+p.price||0), 0);
  const spent    = parts.filter(p => p.status !== 'planned').reduce((s,p) => s + (+p.price||0), 0);
  const remaining = Math.max(0, total - spent);
  return { total, spent, remaining };
}

async function submitAddBuild() {
  const name   = document.getElementById('new-build-name')?.value.trim();

  const status = document.getElementById('new-build-status')?.value;
  if (!name) { toast('Build name is required', 'error'); return; }

  const newBuild = { name, car_model: model, status, user_id: state.user.id, budget_total: 0 };

  if (DEMO_MODE) {
    newBuild.id = mkId();
    state.builds.push(newBuild);
  } else {
    const { data, error } = await sb.from('builds').insert(newBuild).select().single();
    if (error) { toast('Failed to create build', 'error'); return; }
    state.builds.push(data);
    newBuild.id = data.id;
  }

  document.getElementById('build-modal')?.remove();
  toast('Build created!');
  if (!state.currentBuild) { state.currentBuild = state.builds[0]; await loadBuildData(); }
  renderBuilds();

async function switchBuild(id) {
  state.currentBuild = state.builds.find(b => b.id === id);
  await loadBuildData();
  navigate('dashboard');
  toast('Switched to ' + state.currentBuild.name);
}

async function deleteBuild(id) {
  if (!confirm('Delete this build and all its data?')) return;
  if (DEMO_MODE) {
    state.builds = state.builds.filter(b => b.id !== id);
    if (state.currentBuild?.id === id) { state.currentBuild = state.builds[0] || null; await loadBuildData(); }
  } else {
    await sb.from('builds').delete().eq('id', id);
    state.builds = state.builds.filter(b => b.id !== id);
    if (state.currentBuild?.id === id) { state.currentBuild = state.builds[0] || null; if (state.currentBuild) await loadBuildData(); }
  }
  toast('Build deleted');
  renderBuilds();
}

<div class="page-header flex justify-between items-center flex-wrap gap-10">

<!-- Summary -->

function renderMntItem(m) {
  const icons = { up_to_date:'✓', due:'!', overdue:'✕' };
  return `
<div class="mnt-item">
  <div class="mnt-check ${m.status}">${icons[m.status]||'?'}</div>
  <div style="flex:1;min-width:0">
    <div style="font-size:13px;font-weight:600;color:var(--text)">${escHtml(m.item)}</div>
    <div style="font-size:11px;color:var(--sub);margin-top:2px">
      Last: ${m.last_done||'—'} · Next: ${m.next_due||'—'}
      ${m.interval_km ? ` · Every ${m.interval_km.toLocaleString()} km` : ''}
      ${m.interval_months ? ` · Every ${m.interval_months} months` : ''}
    </div>
  </div>
  <span class="mono" style="font-size:12px;color:var(--cyan);flex-shrink:0">${fmt(m.cost)}</span>
  <span class="badge badge-${m.status}" style="flex-shrink:0">${m.status.replace('_',' ')}</span>
  <div class="flex gap-8" style="flex-shrink:0">
    <button class="btn-icon" onclick="openEditMntModal('${m.id}')">✎</button>
    <button class="btn-danger" onclick="deleteMntItem('${m.id}')">✕</button>
  </div>
</div>`;
}

function mntFormHtml(m) {
  return `
<div class="form-group mb-16"><label class="form-label">Item *</label><input id="mnt-item" placeholder="e.g. Oil Change" value="${escHtml(m?.item||'')}"/></div>
<div class="form-grid-2 mb-16">
  <div class="form-group"><label class="form-label">Cost ($)</label><input id="mnt-cost" type="number" min="0" value="${m?.cost||''}"/></div>
  <div class="form-group"><label class="form-label">Status</label>
    <select id="mnt-status">
      <option value="up_to_date" ${m?.status==='up_to_date'?'selected':''}>Up to Date</option>
      <option value="due" ${m?.status==='due'?'selected':''}>Due</option>
      <option value="overdue" ${m?.status==='overdue'?'selected':''}>Overdue</option>
    </select>
  </div>
</div>
<div class="form-grid-2 mb-16">
  <div class="form-group"><label class="form-label">Interval (km)</label><input id="mnt-km" type="number" min="0" placeholder="e.g. 7000" value="${m?.interval_km||''}"/></div>
  <div class="form-group"><label class="form-label">Interval (months)</label><input id="mnt-mo" type="number" min="0" placeholder="e.g. 6" value="${m?.interval_months||''}"/></div>
</div>
<div class="form-grid-2">
  <div class="form-group"><label class="form-label">Last Done</label><input id="mnt-last" type="date" value="${m?.last_done||''}"/></div>
  <div class="form-group"><label class="form-label">Next Due</label><input id="mnt-next" type="date" value="${m?.next_due||''}"/></div>
</div>`;
}

function openAddMntModal() {
  $('mnt-modal-title').textContent = 'Add Maintenance Item';
  $('mnt-modal-body').innerHTML = mntFormHtml(null);
  $('mnt-modal').classList.add('open');
  $('mnt-modal-save').onclick = () => submitMnt(null);
}

function openEditMntModal(id) {
  const m = state.maintenance.find(x=>x.id===id);
  if (!m) return;
  $('mnt-modal-title').textContent = 'Edit Maintenance Item';
  $('mnt-modal-body').innerHTML = mntFormHtml(m);
  $('mnt-modal').classList.add('open');
  $('mnt-modal-save').onclick = () => submitMnt(id);
}

async function submitMnt(id) {
  const item = $('mnt-item')?.value.trim();
  if (!item) { toast('Item name required','error'); return; }
  const data = {
    item,
    cost: parseFloat($('mnt-cost')?.value)||0,
    status: $('mnt-status')?.value||'up_to_date',
    interval_km: parseInt($('mnt-km')?.value)||null,
    interval_months: parseInt($('mnt-mo')?.value)||null,
    last_done: $('mnt-last')?.value||null,
    next_due: $('mnt-next')?.value||null,
  };
  if (id) data.id = id;
  const ok = await saveMaintenance(data);
  if (ok) { toast(id?'Item updated':'Item added'); closeMntModal(); renderMaintenance(); }
}

async function deleteMntItem(id) {
  if (!confirm('Remove this maintenance item?')) return;
  await deleteMaintenance(id);
  toast('Item removed'); renderMaintenance();
}

function closeMntModal() { $('mnt-modal').classList.remove('open'); }

// PAGE: PERFORMANCE ESTIMATOR
// ═══════════════════════════════════════════════════════════
function renderEstimator() {
  $('page-content').innerHTML = `
<div class="page-header">
  <div class="page-title">Performance Estimator</div>
  <div class="page-desc">Horsepower gain calculator for forced induction builds</div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">Engine Parameters</div>

    <div class="form-group mb-16">
      <label class="form-label">Engine Type</label>
      <select id="est-type" onchange="runEstimator()">
        <option value="turbo">Turbocharged</option>
        <option value="supercharged" selected>Supercharged</option>
        <option value="twinscrew">Twin-Screw Supercharger</option>
      </select>
    </div>

    <div class="form-group mb-16">
      <label class="form-label">Stock Horsepower (HP)</label>
      <input id="est-hp" type="number" min="50" max="1000" value="240" oninput="runEstimator()" placeholder="e.g. 240"/>
    </div>

    <div class="form-group mb-16">
      <label class="form-label">Boost Pressure (PSI): <span id="est-psi-label" class="mono text-primary">6</span> PSI</label>
      <input id="est-psi" type="range" min="2" max="25" value="6" oninput="runEstimator();$('est-psi-label').textContent=this.value"/>
    </div>

    <div class="form-group mb-16">
      <label class="form-label">Intercooler Efficiency</label>
      <select id="est-ic" onchange="runEstimator()">
        <option value="0.95">Excellent (Water-to-Air)</option>
        <option value="0.85" selected>Good (Air-to-Air)</option>
        <option value="0.70">Basic / None</option>
      </select>
    </div>

    <div class="form-group mb-16">
      <label class="form-label">Tuning Quality</label>
      <select id="est-tune" onchange="runEstimator()">
        <option value="1.10">Professional (Custom Map)</option>
        <option value="1.02" selected>Standard (Off-the-Shelf)</option>
        <option value="0.92">Untuned (Stock ECU)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Engine Condition</label>
      <select id="est-cond" onchange="runEstimator()">
        <option value="1.0" selected>Freshly Rebuilt</option>
        <option value="0.95">Good (Low Miles)</option>
        <option value="0.88">Worn (High Miles)</option>
      </select>
    </div>
  </div>

  <!-- Results -->
  <div>
    <div class="card mb-16">
      <div class="card-title" style="margin-bottom:4px">Estimated Output</div>
      <div class="card-sub" style="margin-bottom:16px">Realistic range based on your inputs</div>
      <div id="est-result">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Key Assumptions</div>
      <div class="info-row"><span class="label">Volumetric efficiency</span><span class="value">80–85%</span></div>
      <div class="info-row"><span class="label">Drivetrain loss</span><span class="value">~15%</span></div>
      <div class="info-row"><span class="label">Boost ramp efficiency</span><span class="value">Varies by PSI</span></div>
      <div class="info-row"><span class="label">Fuel system adequacy</span><span class="value">Assumed sufficient</span></div>
      <div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px;font-size:11px;color:var(--sub);line-height:1.6">
        ⚠ These are engineering estimates, not guarantees. Real-world results depend on fuel octane, ambient conditions, engine health, and tuner skill. Always dyno-test after modifications.
      </div>
    </div>
  </div>
</div>`;

  runEstimator();
}

function runEstimator() {
  const hp    = parseFloat($('est-hp')?.value)  || 240;
  const psi   = parseFloat($('est-psi')?.value) || 6;
  const type  = $('est-type')?.value || 'supercharged';
  const ic    = parseFloat($('est-ic')?.value)  || 0.85;
  const tune  = parseFloat($('est-tune')?.value)|| 1.02;
  const cond  = parseFloat($('est-cond')?.value)|| 1.0;

  // Pressure ratio calculation
  const atm = 14.696;
  const pr  = (atm + psi) / atm;

  // Compressor efficiency varies by type
  const compEff = { turbo: 0.78, supercharged: 0.72, twinscrew: 0.80 }[type] || 0.72;

  // Temp rise (intake air heating)
  const T1 = 298; // ~25°C in Kelvin
  const T2 = T1 * (Math.pow(pr, (1.4-1)/1.4) - 1) / compEff + T1;

  // Density ratio after intercooling
  const T_ic = T1 + (T2 - T1) * (1 - ic);
  const densityRatio = pr * (T1 / T_ic);

  // HP gain
  const gainBase = hp * (densityRatio - 1) * 0.82;
  const gainAdj  = gainBase * tune * cond;

  const gainLow  = Math.round(gainAdj * 0.88);
  const gainHigh = Math.round(gainAdj * 1.12);
  const hpLow    = Math.round(hp + gainLow);
  const hpHigh   = Math.round(hp + gainHigh);
  const midHp    = Math.round((hpLow + hpHigh) / 2);

  // Stress level
  let stress = 'Low', stressColor = 'var(--green)', stressIcon = '✓';
  if (psi >= 12) { stress = 'Very High'; stressColor = 'var(--red)'; stressIcon = '✕'; }
  else if (psi >= 8) { stress = 'High'; stressColor = 'var(--red)'; stressIcon = '⚠'; }
  else if (psi >= 6) { stress = 'Moderate'; stressColor = 'var(--amber)'; stressIcon = '!'; }

  const warnings = [];
  if (psi >= 8)  warnings.push('Forged internals (pistons, rods) highly recommended above 8 PSI');
  if (psi >= 10) warnings.push('Upgraded cooling system essential — thermal management critical');
  if (psi >= 12) warnings.push('Professional fuel system upgrade required (injectors, pump, regulator)');
  if (hpHigh > hp * 1.5) warnings.push('Expected power increase exceeds 50% — drivetrain (clutch, gearbox) stress likely');
  if (type === 'turbo' && psi < 5) warnings.push('Low boost on turbo may not justify the installation complexity');

  const el = $('est-result');
  if (!el) return;

  el.innerHTML = `
<div style="text-align:center;padding:16px 0">
  <div style="font-size:11px;color:var(--sub);letter-spacing:2px;margin-bottom:8px">ESTIMATED WHEEL HP RANGE</div>
  <div class="est-hp-range">${hpLow} – ${hpHigh} HP</div>
  <div style="font-size:13px;color:var(--sub);margin-top:6px">midpoint ~${midHp} HP at wheels</div>
</div>

<div class="divider"></div>

<div class="info-row"><span class="label">Stock HP</span><span class="value">${hp} HP</span></div>
<div class="info-row"><span class="label">Estimated Gain</span><span class="value text-cyan">+${gainLow}–${gainHigh} HP</span></div>
<div class="info-row"><span class="label">Boost Pressure</span><span class="value mono">${psi} PSI</span></div>
<div class="info-row"><span class="label">Pressure Ratio</span><span class="value mono">${pr.toFixed(2)}:1</span></div>
<div class="info-row">
  <span class="label">Engine Stress</span>
  <span style="font-weight:600;color:${stressColor}">${stressIcon} ${stress}</span>
</div>

${warnings.length > 0 ? `
<div class="est-warning">
  <div style="font-weight:600;margin-bottom:6px">⚠ Engineering Warnings</div>
  ${warnings.map(w=>`<div style="margin-top:4px">· ${w}</div>`).join('')}
</div>` : `
<div style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;font-size:12px;color:var(--green)">
  ✓ Build looks manageable at this boost level. Always verify with a trusted tuner.
</div>`}`;
}

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════
function setupEventListeners() {
  // Login
  $('login-btn').addEventListener('click', handleLogin);
  $('login-password').addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
  $('login-email').addEventListener('keydown', e => { if(e.key==='Enter') $('login-password').focus(); });

  // Logout
  $('logout-btn').addEventListener('click', handleLogout);

  // Hamburger
  $('ham-btn').addEventListener('click', () => {
    const sb = $('sidebar');
    const ov = $('overlay');
    sb.classList.toggle('open');
    ov.classList.toggle('visible');
  });

  $('overlay').addEventListener('click', () => {
    $('sidebar').classList.remove('open');
    $('overlay').classList.remove('visible');
  });

  // Nav items
  document.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', () => {
      navigate(el.dataset.page);
      // Close mobile sidebar
      $('sidebar').classList.remove('open');
      $('overlay').classList.remove('visible');
    });
  });

  // Close modals on overlay click
  $('part-modal').addEventListener('click', e => { if(e.target === $('part-modal')) closePartModal(); });
  $('mnt-modal').addEventListener('click',  e => { if(e.target === $('mnt-modal'))  closeMntModal(); });
}
